name: LEDGIX Flutter APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.dart'
      - '**/pubspec.yaml'
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build LEDGIX APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find and extract LEDGIX Flutter source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          WORK_DIR="$RUNNER_TEMP/ledgix-source"
          mkdir -p "$WORK_DIR"

          # Prefer the known source archive names, case-insensitively.
          ARCHIVE=""
          while IFS= read -r candidate; do
            base="$(basename "$candidate" | tr '[:upper:]' '[:lower:]')"
            if [[ "$base" == "ledgix_fixed_source.zip" || "$base" == "ledgix_app.zip" ]]; then
              ARCHIVE="$candidate"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print | sort)

          if [[ -n "$ARCHIVE" ]]; then
            echo "Extracting source archive: $ARCHIVE"
            unzip -t "$ARCHIVE"
            unzip -q "$ARCHIVE" -d "$WORK_DIR"
            PROJECT_DIR="$(find "$WORK_DIR" -type f -name pubspec.yaml -printf '%h\n' | head -n 1)"
          elif [[ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE" -mindepth 2 -type f -name pubspec.yaml -printf '%h\n' | head -n 1)"
          fi

          if [[ -z "${PROJECT_DIR:-}" || ! -f "$PROJECT_DIR/pubspec.yaml" ]]; then
            echo 'ERROR: Flutter pubspec.yaml was not found. Upload LEDGIX_FIXED_SOURCE.zip or ledgix_app.zip to the repository root.'
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -80

      - name: Generate Android platform files
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/settings.gradle && ! -f android/settings.gradle.kts ]]; then
            flutter create --no-pub --platforms=android --org com.ledgix --project-name ledgix .
          fi
          test -f android/settings.gradle -o -f android/settings.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

      - name: Install Flutter packages
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: flutter pub get

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: flutter build apk --debug

      - name: Verify APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Run unit tests (report only)
        working-directory: ${{ steps.source.outputs.project_dir }}
        continue-on-error: true
        run: flutter test

      - name: Analyze Dart code (report only)
        working-directory: ${{ steps.source.outputs.project_dir }}
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Upload LEDGIX APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDGIX-debug-APK
          path: ${{ steps.source.outputs.project_dir }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
