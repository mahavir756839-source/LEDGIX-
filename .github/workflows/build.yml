
name: Build LEDGIX APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract LEDGIX source
        run: |
          test -f LEDGIX-source.zip
          unzip -o LEDGIX-source.zip
          test -f BajrangTally/settings.gradle.kts
          test -f BajrangTally/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: BajrangTally
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp BajrangTally/app/build/outputs/apk/debug/app-debug.apk LEDGIX-debug.apk
          test -s LEDGIX-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDGIX-apk
          path: LEDGIX-debug.apk
          if-no-files-found: error
          
