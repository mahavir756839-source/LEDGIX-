name: LEDGIX APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LEDGIX Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract LEDGIX Android source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname 'LEDGIX-source*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: LEDGIX-source*.zip not found in repository root."
            echo "Upload the Android source ZIP to the repository root, then run this workflow again."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ledgix_source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/ledgix_source"

          SETTINGS="$(find "$RUNNER_TEMP/ledgix_source" -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found in source ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app module build file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -100

      - name: Build LEDGIX Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload LEDGIX APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDGIX-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
