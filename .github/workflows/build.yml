
name: Build LEDGIX APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f \
            -iname 'LEDGIX*.zip' | sort | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: LEDGIX source ZIP not found"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          SETTINGS="$(find extracted -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file missing in ZIP"
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        shell: bash
        run: |
          set -e
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          curl -fL --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o "$RUNNER_TEMP/android-tools.zip"

          mkdir -p "$RUNNER_TEMP/android-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" \
            -d "$RUNNER_TEMP/android-tools"

          mv "$RUNNER_TEMP/android-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept licenses and install SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses \
            >/dev/null 2>&1 || true

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Fix missing launcher background color
        shell: bash
        run: |
          set -e
          RES="$PROJECT_DIR/app/src/main/res"
          mkdir -p "$RES/values"

          if grep -Rqs \
            'ic_launcher_background' \
            "$RES" --include='*.xml'; then

            if ! grep -Rqs \
              'name="ic_launcher_background"' \
              "$RES/values" --include='*.xml'; then

              cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#10131C</color>
          </resources>
          XML
            fi
          else
            echo "Launcher background reference not found; no color added."
          fi

          echo "Launcher resource check:"
          grep -Rns 'ic_launcher_background' "$RES" \
            --include='*.xml' || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          cp "$APK" LEDGIX.apk
          ls -lh LEDGIX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDGIX-apk
          path: LEDGIX.apk
          if-no-files-found: error
          retention-days: 7
          
