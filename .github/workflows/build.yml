name: Build LEDGIX APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract LEDGIX source ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository files:"
          ls -lah
          ZIP="$(find . -maxdepth 1 -type f -iname 'LEDGIX*.zip' -printf '%f\n' | sort | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "::error::No LEDGIX*.zip found in repository root."
            find . -maxdepth 2 -type f -iname '*.zip' -print || true
            exit 1
          fi
          echo "Using source archive: $ZIP"
          mkdir -p "$RUNNER_TEMP/ledgix-extracted"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/ledgix-extracted"
          SETTINGS="$(find "$RUNNER_TEMP/ledgix-extracted" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No Gradle settings file found inside $ZIP"
            find "$RUNNER_TEMP/ledgix-extracted" -maxdepth 4 -type f | head -150
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected Gradle project: $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Repair missing launcher background resource if referenced
        shell: bash
        run: |
          set -euo pipefail
          RES="$PROJECT_DIR/app/src/main/res"
          [ -d "$RES" ] || { echo "No app resources directory at $RES"; exit 1; }
          mkdir -p "$RES/values"
          if grep -Rqs 'ic_launcher_background' "$RES" --include='*.xml'; then
            if ! grep -Rqs 'name="ic_launcher_background"' "$RES/values" --include='*.xml'; then
              cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#10131C</color>
          </resources>
          XML
            fi
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No debug APK was generated."
            find "$PROJECT_DIR" -path '*/build/outputs/*' -type f -print || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ledgix-artifact"
          cp "$APK" "$RUNNER_TEMP/ledgix-artifact/LEDGIX.apk"
          ls -lh "$RUNNER_TEMP/ledgix-artifact/LEDGIX.apk"
          file "$RUNNER_TEMP/ledgix-artifact/LEDGIX.apk"
          unzip -t "$RUNNER_TEMP/ledgix-artifact/LEDGIX.apk" | tail -n 2

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDGIX-apk
          path: ledgix-artifact/LEDGIX.apk
          if-no-files-found: error
          retention-days: 7
